<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>경기 버스 안내봇</title>
  <style>
    :root {
      --room: #b2c7da;          /* 채팅방 배경 (하늘빛 회색) */
      --bar: #ffffff;           /* 상단·입력 바 */
      --text: #191919;
      --muted: #556677;
      --soft: #8a97a5;
      --line: #e6e9ed;
      --me: #fee500;            /* 내 말풍선 (노랑) */
      --me-text: #191919;
      --bot: #ffffff;           /* 봇 말풍선 */
      --card: #ffffff;
      --accent: #3b6fd8;        /* 노선 번호·링크 */
      --soon: #e5484d;
      --soon-bg: #ffecec;
      --chip: rgba(255, 255, 255, 0.85);
      --chip-text: #2b3a4a;
      --badge-bg: #eef2f6;
      --hover: #f4f7fb;
      --picked-row: #fff9d6;
      --avatar: #ffd84d;
      --shadow: 0 1px 1.5px rgba(0, 0, 0, 0.08);
      --notice: rgba(0, 0, 0, 0.16);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --room: #1e2a35;
        --bar: #151d25;
        --text: #eef1f4;
        --muted: #a9b6c3;
        --soft: #7d8b99;
        --line: #2a3542;
        --me: #f5d90a;
        --me-text: #191919;
        --bot: #2a3643;
        --card: #24303c;
        --accent: #7aa7ff;
        --soon: #ff7b7f;
        --soon-bg: #3c2428;
        --chip: rgba(42, 54, 67, 0.9);
        --chip-text: #e3e9ef;
        --badge-bg: #33404d;
        --hover: #2c3946;
        --picked-row: #3a3a22;
        --avatar: #e8c53d;
        --shadow: 0 1px 1.5px rgba(0, 0, 0, 0.3);
        --notice: rgba(0, 0, 0, 0.3);
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--room);
      color: var(--text);
      font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, -apple-system, sans-serif;
      font-size: 15px;
      -webkit-font-smoothing: antialiased;
      display: flex;
      justify-content: center;
    }
    .app {
      width: 100%;
      max-width: 760px;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: var(--room);
    }
    @media (min-width: 800px) {
      body { background: #8fa3b6; }
      .app { box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.06), 0 10px 40px rgba(0, 0, 0, 0.18); }
    }
    @media (min-width: 800px) and (prefers-color-scheme: dark) {
      body { background: #0f151b; }
    }

    /* ---------- 상단 바 ---------- */
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: var(--room);
    }
    .room-avatar {
      width: 40px;
      height: 40px;
      border-radius: 15px;
      background: var(--avatar);
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }
    .room-avatar svg, .avatar svg { width: 60%; height: 60%; }
    .room-title { flex: 1; min-width: 0; }
    .room-title h1 { font-size: 16px; font-weight: 700; margin: 0; }
    .room-title p { font-size: 12px; color: var(--muted); margin: 2px 0 0; }
    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--text);
      display: grid;
      place-items: center;
      cursor: pointer;
    }
    .icon-btn:hover { background: rgba(0, 0, 0, 0.06); }
    .icon-btn svg { width: 20px; height: 20px; }
    .icon-btn[hidden] { display: none; }

    /* ---------- 계정 (구글 로그인) ---------- */
    header { position: relative; }
    .account-btn .initial {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--avatar);
      color: #3a2e00;
      font-size: 13px;
      font-weight: 700;
      display: grid;
      place-items: center;
    }
    .account-menu {
      position: absolute;
      top: calc(100% - 4px);
      right: 12px;
      z-index: 15;
      width: 250px;
      padding: 14px;
      border-radius: 14px;
      background: var(--bar);
      color: var(--text);
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.18);
    }
    .account-menu[hidden] { display: none; }
    .account-menu strong { display: block; font-size: 15px; }
    .account-menu p { margin: 4px 0 12px; font-size: 12px; color: var(--muted); line-height: 1.5; }
    .account-menu .google-btn, .account-menu .logout-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: #fff;
      color: #1f1f1f;
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
    }
    .account-menu .google-btn:hover, .account-menu .logout-btn:hover { background: #f4f4f4; }
    .account-menu .google-btn svg { width: 18px; height: 18px; }

    /* ---------- 즐겨찾기 ---------- */
    .fav-open { position: relative; color: #e0a800; }
    .fav-count {
      position: absolute;
      top: 2px;
      right: 0;
      min-width: 16px;
      height: 16px;
      padding: 0 4px;
      border-radius: 999px;
      background: var(--soon);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      line-height: 16px;
      text-align: center;
    }
    .star-btn {
      border: none;
      background: transparent;
      padding: 0 4px 0 0;
      margin: 0;
      font-size: 16px;
      line-height: 1;
      color: var(--soft);
      cursor: pointer;
      vertical-align: -1px;
    }
    .star-btn.on { color: #f5b800; }
    .star-btn:hover { transform: scale(1.15); }
    .sheet-backdrop {
      position: fixed;
      inset: 0;
      z-index: 20;
      background: rgba(0, 0, 0, 0.38);
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }
    .sheet-backdrop[hidden] { display: none; }
    .sheet {
      width: min(760px, 100%);
      max-height: 72vh;
      display: flex;
      flex-direction: column;
      background: var(--bar);
      color: var(--text);
      border-radius: 18px 18px 0 0;
      padding: 6px 0 calc(10px + env(safe-area-inset-bottom));
      box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.2);
      animation: sheet-up 0.18s ease-out;
    }
    @keyframes sheet-up { from { transform: translateY(24px); } to { transform: none; } }
    .sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 6px 10px 0 18px; }
    .sheet-head h2 { font-size: 16px; margin: 0; }
    .sheet-hint { margin: 2px 18px 8px; font-size: 12px; color: var(--muted); }
    .fav-list { list-style: none; margin: 0; padding: 0 10px; overflow-y: auto; }
    .fav-list li { display: flex; align-items: center; gap: 4px; border-top: 1px solid var(--line); }
    .fav-list li:first-child { border-top: none; }
    .fav-item {
      flex: 1;
      min-width: 0;
      text-align: left;
      border: none;
      background: transparent;
      color: var(--text);
      font: inherit;
      padding: 11px 8px;
      border-radius: 10px;
      cursor: pointer;
    }
    .fav-item:hover { background: var(--hover); }
    .fav-item strong { display: block; font-size: 15px; }
    .fav-item span { display: block; margin-top: 2px; font-size: 12px; color: var(--muted); }
    .fav-empty { padding: 18px 8px 22px; color: var(--muted); font-size: 13px; text-align: center; }

    /* ---------- 대화 영역 ---------- */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 8px 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      scroll-behavior: smooth;
    }
    #messages::-webkit-scrollbar { width: 6px; }
    #messages::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.15); border-radius: 3px; }
    .date-pill, .notice {
      align-self: center;
      padding: 4px 12px;
      border-radius: 999px;
      background: var(--notice);
      color: #fff;
      font-size: 12px;
      flex-shrink: 0;
    }
    .notice.error { background: rgba(229, 72, 77, 0.85); }

    .row { display: flex; gap: 8px; flex-shrink: 0; }
    .row.me { justify-content: flex-end; }
    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 15px;
      background: var(--avatar);
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }
    .col { display: flex; flex-direction: column; gap: 6px; min-width: 0; max-width: calc(100% - 48px); }
    .row.me .col { align-items: flex-end; max-width: 78%; }
    .name { font-size: 12px; color: var(--muted); margin: 2px 0 0 2px; }

    .line { display: flex; align-items: flex-end; gap: 6px; }
    .row.me .line { flex-direction: row-reverse; }
    .time { font-size: 10.5px; color: var(--muted); white-space: nowrap; flex-shrink: 0; padding-bottom: 1px; }

    .bubble {
      position: relative;
      padding: 9px 12px;
      border-radius: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
      box-shadow: var(--shadow);
      max-width: 100%;
    }
    .bubble.bot { background: var(--bot); color: var(--text); border-top-left-radius: 4px; }
    .bubble.me { background: var(--me); color: var(--me-text); border-top-right-radius: 4px; }
    /* 말풍선 꼬리 */
    .bubble.bot.tail::before, .bubble.me.tail::before {
      content: "";
      position: absolute;
      top: 0;
      width: 8px;
      height: 10px;
    }
    .bubble.bot.tail::before { left: -6px; background: var(--bot); clip-path: polygon(100% 0, 0 0, 100% 100%); }
    .bubble.me.tail::before { right: -6px; background: var(--me); clip-path: polygon(0 0, 100% 0, 0 100%); }

    /* 입력 중 */
    .typing { display: inline-flex; gap: 4px; padding: 13px 14px; }
    .typing span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--soft);
      animation: blink 1.2s infinite ease-in-out;
    }
    .typing span:nth-child(2) { animation-delay: 0.15s; }
    .typing span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes blink { 0%, 80%, 100% { opacity: 0.25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-3px); } }

    /* 빠른 질문 칩 */
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      border: none;
      background: var(--chip);
      color: var(--chip-text);
      border-radius: 999px;
      padding: 7px 12px;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
      box-shadow: var(--shadow);
    }
    .chip:hover { filter: brightness(0.97); }
    .chip { display: inline-flex; align-items: center; gap: 6px; text-align: left; }
    /* 정책 질문 10종: 2열 카드 (주제 위, 질문 아래) */
    .chips.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; width: min(420px, 100%); }
    .chips.grid .chip {
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
      border-radius: 12px;
      padding: 8px 10px;
      font-size: 12.5px;
      line-height: 1.35;
      word-break: keep-all;
    }
    .chip-tag {
      flex-shrink: 0;
      font-size: 11px;
      font-weight: 700;
      padding: 1px 7px;
      border-radius: 999px;
      background: var(--avatar);
      color: #3a2e00;
    }
    .chip:disabled { opacity: 0.5; cursor: default; }

    /* ---------- 표 카드 ---------- */
    .table-card {
      width: min(660px, 100%);
      border-radius: 14px;
      overflow: hidden;
      background: var(--card);
      box-shadow: var(--shadow);
    }
    .table-card h2 {
      font-size: 14px;
      font-weight: 700;
      margin: 0;
      padding: 11px 14px 9px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .table-head { display: flex; align-items: center; gap: 6px; padding-right: 8px; }
    .table-head h2 { flex: 1; min-width: 0; }
    .table-stamp { font-size: 11px; color: var(--muted); white-space: nowrap; }
    .refresh-btn {
      width: 30px;
      height: 30px;
      flex-shrink: 0;
      border: none;
      border-radius: 50%;
      background: var(--badge-bg);
      color: var(--accent);
      display: grid;
      place-items: center;
      cursor: pointer;
    }
    .refresh-btn svg { width: 16px; height: 16px; }
    .refresh-btn:hover { filter: brightness(0.96); }
    .refresh-btn:disabled { cursor: default; opacity: 0.7; }
    .refresh-btn.spinning svg { animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .table-card h2::before {
      content: "";
      width: 4px;
      height: 14px;
      border-radius: 2px;
      background: var(--avatar);
    }
    .table-scroll { overflow-x: auto; }
    .table-card table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
    .table-card th, .table-card td {
      padding: 8px 12px;
      border-top: 1px solid var(--line);
      text-align: left;
      white-space: nowrap;
    }
    .table-card th { color: var(--muted); font-size: 12px; font-weight: 600; background: transparent; }
    .table-card .center { text-align: center; }
    .table-card.clickable tbody tr { cursor: pointer; }
    .table-card.clickable tbody tr:hover { background: var(--hover); }
    .table-card .route { font-weight: 800; color: var(--accent); }
    .table-card td.col-next { color: var(--muted); }
    /* 긴 정류소·다음 정류장 이름은 칸 안에서 줄바꿈 (넓은 화면에서도 가로 넘침 없게) */
    .table-card td.col-name, .table-card td.col-next { white-space: normal; word-break: keep-all; max-width: 170px; }
    .table-card .next-inline { display: none; }
    .table-card td.col-next:not(:empty)::before { content: "→ "; color: var(--soft); }
    .table-card .soon { color: var(--soon); font-weight: 700; }
    .table-card .eta { display: block; font-weight: 700; }
    .table-card .stops { display: block; font-size: 11.5px; color: var(--muted); }
    .badge {
      display: inline-block;
      padding: 1px 7px;
      margin-right: 4px;
      border-radius: 999px;
      font-size: 11.5px;
      background: var(--badge-bg);
    }
    .badge.soon { background: var(--soon-bg); color: var(--soon); }
    .badge.picked { background: var(--me); color: #191919; font-weight: 700; }
    .table-card.clickable tbody tr.selected { background: var(--picked-row); }
    /* 폰 폭: 덜 중요한 칸(정류소 ID, 차량)은 숨기고 여백을 줄여 가로 스크롤 없이 보이게 */
    @media (max-width: 560px) {
      .table-card table { font-size: 12.5px; }
      .table-card th, .table-card td { padding: 7px 8px; }
      .table-card .col-id, .table-card .col-info, .table-card .col-next { display: none; }
      .table-card .next-inline { display: block; margin-top: 2px; font-size: 11.5px; color: var(--muted); }
      .table-card .col-name { max-width: 150px; }
      .table-card .col-dest, .table-card .col-name, .table-card .col-next {
        white-space: normal; word-break: keep-all; overflow-wrap: anywhere; min-width: 64px; max-width: 92px;
      }
      .table-card .badge.soon { display: block; width: fit-content; margin: 0 0 2px; }
    }
    .table-note {
      padding: 8px 14px 10px;
      font-size: 12px;
      color: var(--muted);
      border-top: 1px solid var(--line);
      white-space: normal;
    }

    /* ---------- 출처 · 피드백 ---------- */
    .sources {
      background: var(--card);
      border-radius: 12px;
      padding: 8px 12px;
      font-size: 12px;
      color: var(--muted);
      box-shadow: var(--shadow);
      max-width: 100%;
    }
    .sources strong { color: var(--text); font-weight: 700; }
    .sources ul { margin: 4px 0 0; padding-left: 16px; }
    .sources li { margin: 3px 0; word-break: keep-all; overflow-wrap: anywhere; }
    .sources .src-title { color: var(--text); font-weight: 600; }
    .src-link {
      display: inline-block;
      margin-left: 6px;
      padding: 0 8px;
      border-radius: 999px;
      background: var(--badge-bg);
      color: var(--accent);
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
    }
    .src-link:hover { text-decoration: underline; }
    .feedback { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); }
    .feedback button {
      border: none;
      background: var(--chip);
      border-radius: 999px;
      padding: 3px 10px;
      cursor: pointer;
      font-size: 13px;
      box-shadow: var(--shadow);
    }
    .feedback button:disabled { opacity: 0.45; cursor: default; }

    /* ---------- 입력 바 ---------- */
    form {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
      background: var(--bar);
    }
    textarea {
      flex: 1;
      resize: none;
      min-height: 40px;
      max-height: 140px;
      padding: 9px 4px 9px 8px;
      border: none;
      outline: none;
      background: transparent;
      color: var(--text);
      font: inherit;
      line-height: 1.45;
    }
    textarea::placeholder { color: var(--soft); }
    .send {
      width: 40px;
      height: 40px;
      border: none;
      border-radius: 50%;
      background: var(--me);
      color: #191919;
      display: grid;
      place-items: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.15s, opacity 0.15s;
    }
    .send svg { width: 18px; height: 18px; }
    .send:disabled { background: var(--line); color: var(--soft); cursor: default; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="room-avatar" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#3a2e00" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="3" width="16" height="14" rx="3" /><path d="M4 11h16M8 21v-4M16 21v-4" /><circle cx="8" cy="14" r="0.6" fill="#3a2e00" /><circle cx="16" cy="14" r="0.6" fill="#3a2e00" />
        </svg>
      </div>
      <div class="room-title">
        <h1>경기 버스 안내봇</h1>
        <p>실시간 도착 · 요금 · 환승 · 분실물</p>
      </div>
      <button class="icon-btn fav-open" id="fav-open" type="button" title="즐겨찾기 모아보기"
              aria-label="즐겨찾기 모아보기" aria-haspopup="dialog" hidden>
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 2.8l2.8 5.7 6.3.9-4.6 4.4 1.1 6.2L12 17.1 6.4 20l1.1-6.2L2.9 9.4l6.3-.9z" />
        </svg>
        <span class="fav-count" id="fav-count">0</span>
      </button>
      <button class="icon-btn account-btn" id="account-btn" type="button" title="로그인"
              aria-label="로그인" aria-haspopup="true" aria-expanded="false" aria-controls="account-menu" hidden></button>
      <div class="account-menu" id="account-menu" hidden></div>
      <button class="icon-btn" id="reset" type="button" title="대화 초기화" aria-label="대화 초기화">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 1 0 3-6.7" /><path d="M3 4v5h5" />
        </svg>
      </button>
    </header>
    <div id="messages" aria-live="polite"></div>
    <form id="form">
      <textarea id="input" rows="1" placeholder="메시지 입력" aria-label="메시지 입력"></textarea>
      <button class="send" id="send" type="submit" title="전송" aria-label="전송" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 19V5M5 12l7-7 7 7" />
        </svg>
      </button>
    </form>
  </div>

  <!-- 즐겨찾기 모아보기 레이어 (아래에서 올라오는 시트) -->
  <div class="sheet-backdrop" id="fav-layer" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="fav-title">
      <div class="sheet-head">
        <h2 id="fav-title">즐겨찾는 정류소</h2>
        <button class="icon-btn" id="fav-close" type="button" title="닫기" aria-label="닫기">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18" /></svg>
        </button>
      </div>
      <p class="sheet-hint" id="fav-hint">정류소를 누르면 바로 도착 정보를 보여 드려요.</p>
      <ul class="fav-list" id="fav-list"></ul>
    </div>
  </div>

  <script>
    const messagesEl = document.getElementById("messages");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");

    const BOT_NAME = "버스봇";
    // 처음 화면 예시 질문: 실시간 도착 + 정책 문서(docs/policy) 10종의 대표 질문
    const QUICK_ARRIVAL = ["미금역 버스 언제 와?", "7079 도착"];
    const QUICK_POLICY = [
      ["요금", "청소년 버스비 얼마야?"],
      ["환승", "환승 몇 분 안에 해야 할인돼?"],
      ["교통카드", "학생 할인 받으려면 카드 등록해야 돼?"],
      ["분실물", "버스에 지갑 두고 내렸어"],
      ["민원", "기사가 정류장 그냥 지나쳤어 어디 신고해?"],
      ["경기패스", "경기패스 환급 얼마나 받아?"],
      ["어르신·장애인", "어르신 지하철 무료 카드 어디서 만들어?"],
      ["버스정보", "버스 도착 예정 시간이 왜 자꾸 틀려?"],
      ["광역버스", "광역버스 서서 타도 돼?"],
      ["공공버스", "경기도 공공버스가 뭐야?"],
    ];
    const REFRESH_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 4v5h-5"/></svg>';
    const AVATAR_SVG ='<svg viewBox="0 0 24 24" fill="none" stroke="#3a2e00" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="14" rx="3"/><path d="M4 11h16M8 21v-4M16 21v-4"/></svg>';

    let history = []; // [{role, content}]
    let busy = false;
    let lastStations = null; // 마지막으로 보여 준 정류소 후보 표 (도착 표 아래에 다시 보여 준다)
    // 대화 ID: LangSmith에서 한 대화의 질문들을 묶어 보는 데 쓴다 (대화 초기화 때 새로 만든다)
    const newSessionId = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2));
    let sessionId = newSessionId();

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function scrollDown() {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function timeLabel(d = new Date()) {
      const h = d.getHours(), m = String(d.getMinutes()).padStart(2, "0");
      return (h < 12 ? "오전 " : "오후 ") + ((h % 12) || 12) + ":" + m;
    }

    function dateLabel(d = new Date()) {
      const days = ["일", "월", "화", "수", "목", "금", "토"];
      return `${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일 ${days[d.getDay()]}요일`;
    }

    // ---------- 말풍선 묶음 ----------

    // 봇 응답 한 번(말풍선·표·출처·피드백)을 프로필 옆 한 묶음으로 쌓는다
    function botGroup() {
      const row = el("div", "row bot");
      const avatar = el("div", "avatar");
      avatar.innerHTML = AVATAR_SVG; // 고정 SVG (사용자 데이터 아님)
      const col = el("div", "col");
      col.appendChild(el("div", "name", BOT_NAME));
      row.append(avatar, col);
      messagesEl.appendChild(row);
      scrollDown();
      return col;
    }

    function bubbleLine(col, who, text, tail) {
      const line = el("div", "line");
      const bubble = el("div", `bubble ${who}` + (tail ? " tail" : ""), text);
      line.append(bubble, el("span", "time", timeLabel()));
      col.appendChild(line);
      scrollDown();
      return line;
    }

    function addMine(text) {
      const row = el("div", "row me");
      const col = el("div", "col");
      row.appendChild(col);
      messagesEl.appendChild(row);
      return bubbleLine(col, "me", text, true);
    }

    function addNotice(text, error) {
      messagesEl.appendChild(el("div", "notice" + (error ? " error" : ""), text));
      scrollDown();
    }

    function typingIndicator(col) {
      const line = el("div", "line");
      const bubble = el("div", "bubble bot tail typing");
      bubble.append(el("span"), el("span"), el("span"));
      bubble.setAttribute("aria-label", "입력 중");
      line.appendChild(bubble);
      col.appendChild(line);
      scrollDown();
      return line;
    }

    // ---------- 표·출처·피드백 ----------

    // 서버가 준 표(render_table 결과)를 그린다. 데이터는 textContent로만 넣는다.
    function addTable(col, table, opts = {}) {
      col.appendChild(buildTableCard(table, opts));
      scrollDown();
    }

    // 도착 표 제목 줄 오른쪽: "오전 11:59 기준" + ↻ 버튼 (모델 없이 도착 정보만 다시 받아 표를 그 자리에서 바꾼다)
    function tableHead(table, opts, card) {
      const head = el("div", "table-head");
      head.appendChild(el("h2", "", table.title));
      if (table.kind !== "arrivals" || !/^\d{9}$/.test(table.station_id || "")) return head;
      const stamp = el("span", "table-stamp", timeLabel() + " 기준");
      const btn = el("button", "refresh-btn");
      btn.type = "button";
      btn.title = "도착 정보 새로고침";
      btn.setAttribute("aria-label", btn.title);
      btn.innerHTML = REFRESH_SVG; // 고정 SVG (사용자 데이터 아님)
      btn.addEventListener("click", async () => {
        btn.disabled = true;
        btn.classList.add("spinning");
        stamp.textContent = "갱신 중…";
        try {
          const res = await fetch("/api/arrivals?station_id=" + encodeURIComponent(table.station_id));
          const data = await res.json().catch(() => ({}));
          if (!res.ok || !data.table) throw new Error(data.detail || "HTTP " + res.status);
          card.replaceWith(buildTableCard(data.table, opts));
        } catch (err) {
          stamp.textContent = "갱신 실패";
          stamp.title = String(err.message || err);
          btn.disabled = false;
          btn.classList.remove("spinning");
        }
      });
      head.append(stamp, btn);
      return head;
    }

    function buildTableCard(table, opts = {}) {
      const card = el("div", "table-card" + (table.kind === "stations" ? " clickable" : ""));
      card.appendChild(tableHead(table, opts, card));

      const wrap = el("div", "table-scroll");
      const tbl = el("table");
      const headRow = el("tr");
      const colClass = (c) => `col-${c.key}` + (c.align === "center" ? " center" : "");
      table.columns.forEach((c) => headRow.appendChild(el("th", colClass(c), c.label)));
      tbl.appendChild(el("thead")).appendChild(headRow);

      const body = el("tbody");
      table.rows.forEach((row) => {
        const tr = el("tr");
        table.columns.forEach((c) => {
          const td = el("td", colClass(c));
          const value = row[c.key] ?? "";
          if (table.kind === "arrivals" && c.key === "route") {
            td.classList.add("route");
            td.textContent = value;
          } else if (table.kind === "arrivals" && (c.key === "first" || c.key === "second")) {
            // '3분 · 2정류장 전' -> 분은 굵게, 정류장 수는 작게 아랫줄
            const [mins, stops] = String(value).split(" · ");
            const soon = c.key === "first" && row.minutes !== null && row.minutes <= 2;
            if (soon) td.appendChild(el("span", "badge soon", "곧 도착"));
            if (mins) td.appendChild(el("span", "eta" + (soon ? " soon" : ""), mins));
            if (stops) td.appendChild(el("span", "stops", stops));
          } else if (table.kind === "arrivals" && c.key === "info") {
            String(value).split(" · ").filter(Boolean).forEach((t) => td.appendChild(el("span", "badge", t)));
          } else {
            td.textContent = value;
          }
          tr.appendChild(td);
        });
        if (table.kind === "stations") {
          tr.title = row.no + "번 정류소 고르기";
          tr.addEventListener("click", () => {
            if (!busy) send(row.no + "번", row.no);
          });
          if (row.next) {
            // 폰 폭에서는 '다음 정류장' 칸 대신 정류소 이름 아래에 작게 보여 준다 (CSS가 둘 중 하나만 보이게 함)
            const nameCell = tr.querySelector(".col-name");
            if (nameCell) nameCell.appendChild(el("span", "next-inline", "→ " + row.next));  // 화살표가 따로 줄바꿈되지 않게
          }
          if (opts.selectedNo === row.no) {
            // 방금 도착 정보를 본 정류소
            tr.classList.add("selected");
            tr.setAttribute("aria-current", "true");
            const nameCell = tr.querySelector(".col-name");
            if (nameCell) nameCell.prepend(el("span", "badge picked", "조회함"));
          }
          // 정류소 이름 앞 별 버튼: 즐겨찾기 추가/해제 (행 선택과 겹치지 않게 클릭 전파를 막는다)
          const nameCell = tr.querySelector(".col-name");
          if (nameCell && row.id) {
            const star = el("button", "star-btn");
            star.type = "button";
            star.dataset.id = String(row.id);
            star.hidden = !loginEnabled;
            setStar(star, isFav(row.id));
            star.addEventListener("click", (e) => {
              e.stopPropagation();
              toggleFav(row);
            });
            nameCell.prepend(star);
          }
        }
        body.appendChild(tr);
      });
      tbl.appendChild(body);
      wrap.appendChild(tbl);
      card.appendChild(wrap);
      if (table.note) card.appendChild(el("div", "table-note", table.note));
      return card;
    }

    // 정책 답변의 근거 문서 출처 (서버가 검색 결과에서 꺼낸 것)
    function addSources(col, sources) {
      if (!sources.length) return;
      const box = el("div", "sources");
      box.appendChild(el("strong", "", "출처"));
      const list = el("ul");
      sources.forEach((s) => {
        const li = el("li");
        li.appendChild(el("span", "src-title", s.title));
        if (s.name) li.appendChild(el("span", "src-name", " · " + s.name));
        // 공식 페이지를 새 탭에서 연다 (http/https만, 새 탭이 이 페이지에 접근하지 못하게 noopener)
        if (/^https?:\/\//.test(s.url || "")) {
          const a = el("a", "src-link", "바로가기 ↗");
          a.href = s.url;
          a.target = "_blank";
          a.rel = "noopener noreferrer";
          a.title = s.url;
          a.setAttribute("aria-label", `${s.title} 공식 페이지 새 탭에서 열기`);
          li.appendChild(a);
        } else if (!s.name) {
          li.appendChild(el("span", "src-name", " · " + s.citation));
        }
        list.appendChild(li);
      });
      box.appendChild(list);
      col.appendChild(box);
      scrollDown();
    }

    // 답변 아래 👍/👎: 서버가 LangSmith 트레이스에 사용자 피드백으로 기록한다
    function addFeedback(col, traceId) {
      if (!traceId) return;
      const box = el("div", "feedback");
      const label = el("span", "", "도움이 됐나요?");
      const up = el("button", "", "👍");
      const down = el("button", "", "👎");
      up.type = down.type = "button";
      up.title = "도움이 됐어요";
      down.title = "별로예요";
      const rate = async (score) => {
        up.disabled = down.disabled = true;
        try {
          const res = await fetch("/api/feedback", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ trace_id: traceId, score }),
          });
          label.textContent = res.ok ? "의견 고마워요" : "기록하지 못했어요";
        } catch {
          label.textContent = "기록하지 못했어요";
        }
      };
      up.addEventListener("click", () => rate(1));
      down.addEventListener("click", () => rate(0));
      box.append(label, up, down);
      col.appendChild(box);
      scrollDown();
    }

    // ---------- 첫 화면 ----------

    // [주제, 질문] 목록을 누르면 바로 보내지는 버튼으로 만든다
    function chipList(items, grid) {
      const chips = el("div", "chips" + (grid ? " grid" : ""));
      items.forEach(([tag, q]) => {
        const chip = el("button", "chip");
        chip.type = "button";
        if (tag) chip.appendChild(el("span", "chip-tag", tag));
        chip.appendChild(el("span", "", q));
        chip.addEventListener("click", () => { if (!busy) send(q); });
        chips.appendChild(chip);
      });
      return chips;
    }

    // 최초 질문 메뉴: 실시간 도착 예시 + 이용 방법 10종 (첫 화면, 그리고 이용 방법 답변 뒤에 다시 보여 준다)
    function addMenu(col, intro, tail) {
      bubbleLine(col, "bot", intro, tail);
      col.appendChild(chipList(QUICK_ARRIVAL.map((q) => [null, q])));
      bubbleLine(col, "bot", "이용 방법도 물어보세요. 공식 안내에서 찾아 드려요.", false);
      col.appendChild(chipList(QUICK_POLICY, true));
    }

    function welcome() {
      messagesEl.replaceChildren(el("div", "date-pill", dateLabel()));
      addMenu(botGroup(), "안녕하세요! 경기도 버스 안내봇이에요 🚌\n정류소 이름을 말하면 지금 오는 버스를 알려 드려요.", true);
    }

    // ---------- 전송 ----------

    function setBusy(v) {
      busy = v;
      sendBtn.disabled = v || !input.value.trim();
      messagesEl.querySelectorAll(".chip").forEach((c) => (c.disabled = v));
    }

    // '4번', '4', 정류소번호('7043')로 고른 경우 후보 표의 몇 번인지 찾는다
    function pickedNo(text) {
      if (!lastStations) return null;
      const m = text.trim().match(/^(\d+)\s*번?$/);
      if (!m) return null;
      const byMobile = lastStations.rows.find((r) => String(r.mobile) === m[1]);
      const byNo = lastStations.rows.find((r) => r.no === Number(m[1]));
      return (byMobile || byNo || {}).no ?? null;
    }

    // ---------- 즐겨찾기 ----------
    // 로그인하지 않았으면 이 브라우저의 localStorage에, 구글로 로그인했으면 서버(계정)에 저장한다.

    const FAV_KEY = "ggbus.favorites.v1";
    const favOpenBtn = document.getElementById("fav-open");
    const favCountEl = document.getElementById("fav-count");
    const favLayer = document.getElementById("fav-layer");
    const favList = document.getElementById("fav-list");
    const favHint = document.getElementById("fav-hint");
    let user = null;            // 로그인한 사용자 {name} (없으면 null)
    let loginEnabled = false;   // 서버에 구글 로그인이 설정되어 있는지

    function loadFavs() {
      try {
        const v = JSON.parse(localStorage.getItem(FAV_KEY));
        return Array.isArray(v) ? v.filter((f) => f && f.id && f.name) : [];
      } catch {
        return [];
      }
    }
    // 즐겨찾기는 로그인한 사용자만 쓴다 (서버 계정에 저장). localStorage는 예전에 브라우저에 저장해 둔 목록을
    // 처음 로그인할 때 계정으로 옮기는 데만 읽는다 (loadFavs).
    let favorites = [];

    const isFav = (id) => favorites.some((f) => f.id === String(id));

    async function toggleFav(row) {
      if (!user) {
        // 로그인하지 않았으면 저장하지 않고 로그인 메뉴를 연다
        setMenu(true);
        return;
      }
      const id = String(row.id);
      const removing = isFav(id);
      const item = { name: row.name, mobile: String(row.mobile || ""), city: row.city || "", next: row.next || "" };
      const before = favorites;
      favorites = removing ? favorites.filter((f) => f.id !== id) : [...favorites, { id, ...item }];
      refreshFavUI();  // 화면은 바로 바꾸고, 서버 저장이 실패하면 되돌린다
      try {
        const res = await fetch(`/api/favorites/${id}`, {
          method: removing ? "DELETE" : "PUT",
          headers: { "Content-Type": "application/json" },
          body: removing ? undefined : JSON.stringify(item),
        });
        if (res.status === 401) return sessionExpired();
        const data = await res.json();
        if (!res.ok) throw new Error(typeof data.detail === "string" ? data.detail : "");
        favorites = data.items;
      } catch (e) {
        favorites = before;
        addNotice(e.message || "즐겨찾기를 저장하지 못했어요. 잠시 후 다시 시도해 주세요.", true);
      }
      refreshFavUI();
    }

    function setStar(btn, on) {
      btn.textContent = on ? "★" : "☆";
      btn.classList.toggle("on", on);
      btn.setAttribute("aria-pressed", on ? "true" : "false");
      btn.title = !user ? "로그인하면 즐겨찾기를 쓸 수 있어요" : on ? "즐겨찾기 해제" : "즐겨찾기 추가";
      btn.setAttribute("aria-label", btn.title);
    }

    // 별 표시·상단 버튼·열려 있는 레이어를 즐겨찾기 상태에 맞춘다
    function refreshFavUI() {
      favOpenBtn.hidden = favorites.length === 0;
      favCountEl.textContent = favorites.length;
      favHint.textContent = "정류소를 누르면 바로 도착 정보를 보여 드려요. 계정에 저장되어 다른 기기에서도 보여요.";
      document.querySelectorAll(".star-btn[data-id]").forEach((b) => {
        b.hidden = !loginEnabled;  // 서버에 로그인이 설정되지 않았으면 즐겨찾기 자체를 숨긴다
        setStar(b, isFav(b.dataset.id));
      });
      if (!favLayer.hidden) renderFavList();
    }

    function renderFavList() {
      favList.replaceChildren();
      if (!favorites.length) {
        favList.appendChild(el("li", "fav-empty", "즐겨찾는 정류소가 없어요. 후보 표에서 ☆를 눌러 추가해 보세요."));
        return;
      }
      favorites.forEach((f) => {
        const li = el("li");
        const item = el("button", "fav-item");
        item.type = "button";
        item.appendChild(el("strong", "", f.name));
        const sub = [f.next ? "→ " + f.next : "", f.city, f.mobile ? "정류소번호 " + f.mobile : ""].filter(Boolean).join(" · ");
        item.appendChild(el("span", "", sub));
        item.addEventListener("click", () => {
          if (busy) return;
          closeFavs();
          // 화면에는 이름으로 보이고, 서버에는 정류소 ID로 정확히 조회한다
          send(f.name + (f.mobile ? ` (${f.mobile})` : ""), null,
               { query: `정류소 ID ${f.id} 버스 언제 와?`, fromFavorite: true });
        });
        const remove = el("button", "star-btn on");
        remove.type = "button";
        setStar(remove, true);
        remove.addEventListener("click", () => toggleFav(f));
        li.append(item, remove);
        favList.appendChild(li);
      });
    }

    function openFavs() {
      renderFavList();
      favLayer.hidden = false;
      document.getElementById("fav-close").focus();
    }

    function closeFavs() {
      favLayer.hidden = true;
      favOpenBtn.focus();
    }

    favOpenBtn.addEventListener("click", openFavs);
    document.getElementById("fav-close").addEventListener("click", closeFavs);
    favLayer.addEventListener("click", (e) => { if (e.target === favLayer) closeFavs(); });  // 바깥 어두운 곳 누르면 닫기
    document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !favLayer.hidden) closeFavs(); });

    // opts.query: 서버에 보낼 문장이 화면에 보일 문장과 다를 때 (즐겨찾기 조회)
    // opts.fromFavorite: 다른 정류소 조회라 이전 후보 표를 다시 붙이지 않는다
    async function send(text, selectedNo, opts = {}) {
      const query = opts.query || text;
      const picked = selectedNo ?? (opts.query ? null : pickedNo(text));
      const mine = addMine(text);
      setBusy(true);
      const col = botGroup();
      const typing = typingIndicator(col);
      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: query, history, session_id: sessionId }),
        });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        typing.remove();
        // 가드레일이 개인정보를 가렸으면 내 말풍선도 가린 문장으로 바꾸고, 대화 기록에도 가린 문장만 남긴다
        const guard = data.guard || {};
        let sentQuery = query;
        if (guard.pii && guard.pii.length) {
          if (!opts.query) mine.querySelector(".bubble").textContent = guard.masked;
          sentQuery = guard.masked;
          addNotice(`개인정보(${guard.pii.join(", ")})는 가려서 처리했어요. 대화창에 개인정보를 입력하지 마세요.`);
        }
        const tables = data.tables || [];
        // 도착 표가 왔으면(후보 선택·정류소 ID 직접 조회 등) 모델의 요약 말풍선 없이 표부터 보여 준다.
        // (도착 표가 없으면 — 지금 오는 버스 없음·오류·정책 답변 등 — 말풍선이 유일한 답이라 그대로 보여 준다)
        const hasArrivalTable = tables.some((t) => t.kind === "arrivals");
        if (!hasArrivalTable) bubbleLine(col, "bot", data.reply, true);
        tables.forEach((t) => addTable(col, t));
        const shown = [...tables];
        const newStations = tables.find((t) => t.kind === "stations");
        if (newStations) {
          lastStations = newStations;
        } else if (lastStations && !opts.fromFavorite && tables.some((t) => t.kind === "arrivals")) {
          // 후보 중 하나의 도착 정보를 보여 줬으면, 다른 정류소도 바로 고를 수 있게 후보 표를 다시 보여 준다
          const again = { ...lastStations, note: "다른 정류소도 눌러서 도착 정보를 볼 수 있어요." };
          addTable(col, again, { selectedNo: picked });
          shown.push(again);
        }
        addSources(col, data.sources || []);
        addFeedback(col, data.trace_id);
        if (data.intent === "policy_qa") {
          // 이용 방법 답변 뒤에는 최초 질문 메뉴로 돌아가 다음 질문을 바로 고를 수 있게 한다
          addMenu(botGroup(), "다른 것도 궁금하면 골라 보세요. 정류소 이름을 말하면 도착 정보를 알려 드려요.", true);
          // 메뉴가 길어 맨 아래로 내려가면 방금 받은 답이 가려지므로, 답변이 화면 위쪽에 오게 한다
          col.closest(".row").scrollIntoView({ block: "start" });
        }
        // 다음 질문에서 "4번"처럼 고를 수 있게 표의 평문(정류소 ID 포함)도 대화 기록에 남긴다
        // 다시 보여 준 후보 목록도 넣는다: 서버는 최근 대화만 보므로 처음 목록이 밀려나도 번호로 고를 수 있게
        const content = [data.reply, ...shown.map((t) => t.title + "\n" + t.text)].join("\n\n");
        // 차단된 질문은 기록에 남기지 않는다 (다음 질문 맥락에 섞이지 않게)
        if (!guard.blocked) history.push({ role: "user", content: sentQuery }, { role: "assistant", content });
      } catch (err) {
        col.closest(".row").remove();
        addNotice("응답을 받지 못했어요 (" + err.message + ")", true);
      } finally {
        setBusy(false);
        input.focus();
      }
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text || busy) return;
      input.value = "";
      input.style.height = "";
      send(text);
    });

    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
        e.preventDefault();
        form.requestSubmit();
      }
    });

    input.addEventListener("input", () => {
      input.style.height = "auto";
      input.style.height = input.scrollHeight + "px";
      sendBtn.disabled = busy || !input.value.trim();
    });

    document.getElementById("reset").addEventListener("click", () => {
      if (busy) return;
      history = [];
      lastStations = null;
      sessionId = newSessionId();
      welcome();
      input.focus();
    });

    // ---------- 계정 (구글 로그인) ----------
    // 로그인 상태는 서버의 HttpOnly 세션 쿠키가 들고 있어 화면은 /api/me로 묻기만 한다.

    const accountBtn = document.getElementById("account-btn");
    const accountMenu = document.getElementById("account-menu");
    const GOOGLE_SVG = '<svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.6 5.4 2.7 13.3l7.9 6.1C12.5 13.6 17.8 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.4 5.8c4.3-4 6.9-9.9 6.9-17.2z"/><path fill="#FBBC05" d="M10.6 28.6c-.5-1.4-.8-3-.8-4.6s.3-3.2.8-4.6l-7.9-6.1C1 16.6 0 20.2 0 24s1 7.4 2.7 10.7l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.8-5.8l-7.4-5.8c-2.1 1.4-4.8 2.3-8.4 2.3-6.2 0-11.5-4.1-13.4-9.8l-7.9 6.1C6.6 42.6 14.6 48 24 48z"/></svg>';
    const PERSON_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>';

    function renderAccount() {
      accountBtn.hidden = !loginEnabled;
      accountBtn.replaceChildren();
      if (user) {
        accountBtn.appendChild(el("span", "initial", (user.name || "?").trim().charAt(0).toUpperCase()));
        accountBtn.title = `${user.name}님 계정`;
      } else {
        accountBtn.innerHTML = PERSON_SVG;
        accountBtn.title = "로그인";
      }
      accountBtn.setAttribute("aria-label", accountBtn.title);

      accountMenu.replaceChildren();
      if (user) {
        accountMenu.appendChild(el("strong", "", `${user.name}님`));
        accountMenu.appendChild(el("p", "", "Google 계정으로 로그인했어요. 즐겨찾기가 계정에 저장돼요."));
        const out = el("button", "logout-btn", "로그아웃");
        out.type = "button";
        out.addEventListener("click", logout);
        accountMenu.appendChild(out);
      } else {
        accountMenu.appendChild(el("strong", "", "로그인"));
        accountMenu.appendChild(el("p", "", "즐겨찾기는 로그인한 뒤에 쓸 수 있어요. 계정에 저장되어 어느 기기에서나 같은 목록을 볼 수 있어요."));
        const a = el("a", "google-btn");
        a.href = "/auth/google/login";
        a.innerHTML = GOOGLE_SVG;
        a.appendChild(document.createTextNode("Google 계정으로 로그인"));
        accountMenu.appendChild(a);
      }
    }

    function setMenu(open) {
      accountMenu.hidden = !open;
      accountBtn.setAttribute("aria-expanded", open ? "true" : "false");
    }
    accountBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      setMenu(accountMenu.hidden);
    });
    document.addEventListener("click", (e) => {
      if (!accountMenu.hidden && !accountMenu.contains(e.target)) setMenu(false);
    });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !accountMenu.hidden) setMenu(false); });

    // 로그아웃·세션 만료 뒤에는 즐겨찾기를 비운다 (로그인해야 다시 보인다)
    function toLoggedOut() {
      user = null;
      favorites = [];
      if (!favLayer.hidden) closeFavs();
      renderAccount();
      refreshFavUI();
    }

    function sessionExpired() {
      toLoggedOut();
      addNotice("로그인이 만료됐어요. 다시 로그인해 주세요.", true);
    }

    async function logout() {
      setMenu(false);
      try {
        await fetch("/auth/logout", { method: "POST" });
      } catch {
        // 서버에 못 닿아도 화면은 로그아웃 상태로 바꾼다 (쿠키는 다음 로그인 때 새로 발급)
      }
      toLoggedOut();
      addNotice("로그아웃했어요.");
    }

    async function initAccount() {
      const result = new URLSearchParams(location.search).get("login");
      if (result) window.history.replaceState(null, "", location.pathname);  // ?login=ok 를 주소창에서 지운다
      try {
        const me = await (await fetch("/api/me")).json();
        loginEnabled = !!me.login_enabled;
        user = me.user || null;
      } catch {
        return;  // 서버에 못 닿으면 로그인 없이 쓴다
      }
      if (user) {
        // 이 브라우저에만 있던 즐겨찾기를 계정으로 합치고 로컬 사본은 비운다
        const local = loadFavs().filter((f) => /^\d{9}$/.test(f.id)).slice(0, 100);
        try {
          const res = local.length
            ? await fetch("/api/favorites/merge", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ items: local }),
              })
            : await fetch("/api/favorites");
          if (res.status === 401) return sessionExpired();
          if (!res.ok) throw new Error();
          favorites = (await res.json()).items;
          if (local.length) {
            try { localStorage.removeItem(FAV_KEY); } catch {}
            addNotice(`이 브라우저의 즐겨찾기 ${local.length}곳을 계정에 합쳤어요.`);
          }
        } catch {
          addNotice("계정 즐겨찾기를 불러오지 못했어요. 새로고침해 주세요.", true);
        }
      }
      if (result === "failed") addNotice("Google 로그인에 실패했어요. 다시 시도해 주세요.", true);
      else if (result === "ok" && user) addNotice(`${user.name}님, 로그인했어요.`);
      renderAccount();
      refreshFavUI();
    }

    welcome();
    refreshFavUI();
    initAccount();
  </script>
</body>
</html>
