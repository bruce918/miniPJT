<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>경기 버스 도착 챗봇</title>
  <style>
    :root {
      --bg: #f5f6f8;
      --panel: #ffffff;
      --text: #1f2328;
      --muted: #6b7280;
      --border: #e3e5e8;
      --user: #2563eb;
      --user-text: #ffffff;
      --bot: #eef0f3;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16181c;
        --panel: #1e2126;
        --text: #e6e8eb;
        --muted: #9aa1ab;
        --border: #2d3138;
        --user: #3b82f6;
        --bot: #2a2e35;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
      display: flex;
      justify-content: center;
    }
    .app {
      width: 100%;
      max-width: 760px;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: var(--panel);
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
    }
    header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header h1 { font-size: 16px; margin: 0; }
    header button {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 6px;
      padding: 4px 10px;
      cursor: pointer;
    }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user { align-self: flex-end; background: var(--user); color: var(--user-text); border-bottom-right-radius: 4px; }
    .msg.assistant { align-self: flex-start; background: var(--bot); border-bottom-left-radius: 4px; }
    .msg.error { align-self: center; color: #dc2626; font-size: 13px; background: none; }
    .msg.typing { color: var(--muted); }
    .empty { margin: auto; color: var(--muted); text-align: center; }
    form {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      border-top: 1px solid var(--border);
    }
    textarea {
      flex: 1;
      resize: none;
      min-height: 44px;
      max-height: 160px;
      padding: 11px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font: inherit;
    }
    form button {
      padding: 0 18px;
      border: none;
      border-radius: 10px;
      background: var(--user);
      color: #fff;
      font: inherit;
      cursor: pointer;
    }
    form button:disabled { opacity: 0.5; cursor: default; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>경기 버스 도착 챗봇</h1>
      <button id="reset" type="button">대화 초기화</button>
    </header>
    <div id="messages">
      <div class="empty" id="empty">정류소 이름을 알려 주세요.<br>예: 미금역, 수원역 환승센터</div>
    </div>
    <form id="form">
      <textarea id="input" rows="1" placeholder="메시지 입력 (Enter 전송, Shift+Enter 줄바꿈)"></textarea>
      <button id="send" type="submit">전송</button>
    </form>
  </div>

  <script>
    const messagesEl = document.getElementById("messages");
    const emptyEl = document.getElementById("empty");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");

    let history = []; // [{role, content}]

    function addMessage(role, text) {
      emptyEl.style.display = "none";
      const el = document.createElement("div");
      el.className = "msg " + role;
      el.textContent = text;
      messagesEl.appendChild(el);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return el;
    }

    async function send(text) {
      addMessage("user", text);
      sendBtn.disabled = true;
      const typing = addMessage("assistant typing", "입력 중…");
      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text, history }),
        });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        typing.remove();
        addMessage("assistant", data.reply);
        history.push({ role: "user", content: text }, { role: "assistant", content: data.reply });
      } catch (err) {
        typing.remove();
        addMessage("error", "응답을 받지 못했습니다: " + err.message);
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text || sendBtn.disabled) return;
      input.value = "";
      input.style.height = "";
      send(text);
    });

    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
        e.preventDefault();
        form.requestSubmit();
      }
    });

    input.addEventListener("input", () => {
      input.style.height = "auto";
      input.style.height = input.scrollHeight + "px";
    });

    document.getElementById("reset").addEventListener("click", () => {
      history = [];
      messagesEl.querySelectorAll(".msg").forEach((el) => el.remove());
      emptyEl.style.display = "";
      input.focus();
    });
  </script>
</body>
</html>
